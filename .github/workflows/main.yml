name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] 

permissions:
  contents: write
  pages: write      # Tambahkan ini
  id-token: write   # Tambahkan ini

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install and Build
        run: |
          npm install
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist    # Folder hasil build Vite
